name: Ads LINE production preflight

on:
  push:
    branches:
      - feat/ads-line-production-release
      - fix/ads-line-v1-2-repair
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/high-intent-*.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/line1a-*"
      - "scripts/line4a-*"
      - "scripts/hg09-*"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-line-message-*"
      - "scripts/ads-message-asset-*"
      - "scripts/ads-optimization-*"
      - "scripts/ads-landing-*"
      - "scripts/google-ads-provider-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/v12-high-intent-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-production-preflight.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/high-intent-*.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/line1a-*"
      - "scripts/line4a-*"
      - "scripts/hg09-*"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-line-message-*"
      - "scripts/ads-message-asset-*"
      - "scripts/ads-optimization-*"
      - "scripts/ads-landing-*"
      - "scripts/google-ads-provider-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/v12-high-intent-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-production-preflight.yml"
  workflow_dispatch:

concurrency:
  group: ads-line-production-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static export for Pages HTTP integration
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify HQ06 enhanced user-data payload and snapshot
        run: npm run test:hq06:userdata
      - name: Verify Google Ads short-lived provider auth
        run: npm run test:google-ads:auth
      - name: Verify governed Google Ads host provider runner
        run: npm run test:google-ads:host-runner
      - name: Parse Google Ads host provider PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/google-ads-provider-host-runner.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE_FAILED'
          }
          Write-Host 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE=PASS'
      - name: Verify canonical LINE webhook
        shell: bash
        run: |
          set -euo pipefail
          npm run test:line1a:unit
          npm run test:line1a:http
      - name: Verify uploader state machine
        run: npm run test:line4a
      - name: Replay reconstructed migrations 0001 through 0008
        run: node scripts/v12-migration-reconstruction.test.mjs
      - name: Verify Production configuration remains fail closed
        run: node scripts/line4b-production-config.test.mjs
      - name: Verify HG09 single-writer config and topology invariant
        run: npm run test:hg09:topology
      - name: Verify workflow mutation boundary
        run: node scripts/v12-workflow-safety.test.mjs
      - name: Verify reporting evidence is baseline-delta only
        run: node --experimental-strip-types --test scripts/line4d-reporting-evidence.test.ts
      - name: Wrangler exact Production deploy dry run only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('/tmp/hanyao-ci-secrets.json', JSON.stringify({
            GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON: 'ci-dry-run-placeholder',
            PRODUCTION_HUMAN_GATE: 'ci-dry-run-placeholder'
          }), { mode: 0o600 });
          NODE
          trap 'rm -f /tmp/hanyao-ci-secrets.json' EXIT
          npx wrangler deploy --dry-run --env production \
            --config workers/google-ads-uploader/wrangler.jsonc \
            --secrets-file /tmp/hanyao-ci-secrets.json \
            --outdir .wrangler-dryrun/production
