name: Ads LINE production preflight

on:
  push:
    branches:
      - feat/ads-line-production-release
    paths:
      - "workers/google-ads-uploader/**"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-production-preflight.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/google-ads-uploader/**"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-production-preflight.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run uploader regression suite
        run: npm run test:line4a
      - name: Verify Production configuration is fail closed
        run: node scripts/line4b-production-config.test.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Wrangler Production dry run
        run: >-
          npx wrangler deploy --dry-run --env production
          --config workers/google-ads-uploader/wrangler.jsonc
          --outdir .wrangler-dryrun/production

  cloudflare-prestate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Classify existing CI credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          token_state=MISSING
          account_state=MISSING
          google_state=MISSING
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then token_state=PRESENT; fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then account_state=PRESENT; fi
          if [[ -n "${GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON:-}" ]]; then google_state=PRESENT; fi
          if [[ "$token_state" == PRESENT && "$account_state" == PRESENT ]]; then
            echo "state=PRESENT" >> "$GITHUB_OUTPUT"
          else
            echo "state=MISSING" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "CLOUDFLARE_CI_TOKEN=$token_state"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_state"
            echo "GOOGLE_DATA_MANAGER_GITHUB_CREDENTIAL=$google_state"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only Cloudflare D1 prestate
        if: steps.credentials.outputs.state == 'PRESENT'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8'));
          const expectedName = 'hanyao-attribution-production';
          const expectedId = '52453bad-90a3-4495-911b-c3d5b6cefb1f';
          const match = Array.isArray(rows) && rows.some((row) =>
            row && row.name === expectedName && (row.uuid === expectedId || row.id === expectedId)
          );
          console.log(`CLOUDFLARE_PRODUCTION_D1_MATCH=${match ? 'PASS' : 'FAIL'}`);
          if (!match) process.exitCode = 2;
          NODE
      - name: Read-only Production Worker secret names
        if: steps.credentials.outputs.state == 'PRESENT'
        shell: bash
        run: |
          set -u
          set +e
          npx wrangler secret list --env production \
            --config workers/google-ads-uploader/wrangler.jsonc \
            --format json > /tmp/secrets.json 2>/tmp/secrets.err
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo "CLOUDFLARE_PRODUCTION_WORKER=NOT_DEPLOYED_OR_SECRET_LIST_UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('/tmp/secrets.json', 'utf8'));
          const names = new Set((Array.isArray(parsed) ? parsed : []).map((entry) => entry && entry.name).filter(Boolean));
          const serviceAccount = names.has('GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON');
          const humanGate = names.has('PRODUCTION_HUMAN_GATE');
          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(summary, `GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON=${serviceAccount ? 'PRESENT' : 'MISSING'}\n`);
          fs.appendFileSync(summary, `PRODUCTION_HUMAN_GATE=${humanGate ? 'PRESENT' : 'MISSING'}\n`);
          NODE
