name: Ads LINE Production readiness watcher

# v1.2 / VNEXT4.5: this workflow is intentionally NON-MUTATING.
# Production activation authority remains Chat + durable runtime + same-source provider readback.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ads-line-auto-activator.yml"
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/line1a-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify fail-closed Production source state
        run: node scripts/line4b-production-config.test.mjs
      - name: Verify uploader static safety
        run: npm run test:line4a:static
      - name: Replay reconstructed migrations locally
        run: node scripts/v12-migration-reconstruction.test.mjs
      - name: Verify workflow mutation boundary
        run: node scripts/v12-workflow-safety.test.mjs
      - name: Verify reporting evidence is baseline-delta only
        run: node --experimental-strip-types --test scripts/line4d-reporting-evidence.test.ts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Record non-mutating readiness boundary
        shell: bash
        run: |
          {
            echo "PRODUCTION_AUTO_ACTIVATION=DISABLED_BY_DESIGN"
            echo "PRODUCTION_PROVIDER_MUTATIONS=0"
            echo "PR3_AUTO_MERGE=DISABLED"
            echo "PRODUCTION_CRON_AUTO_ARM=DISABLED"
            echo "ACTIVATION_AUTHORITY=CHAT_DURABLE_RUNTIME_PROVIDER_READBACK"
          } >> "$GITHUB_STEP_SUMMARY"
