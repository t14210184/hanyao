name: WP06 custom-domain delivery diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wp06-domain-delivery-diagnostic.yml"

permissions:
  contents: read

jobs:
  compare-delivery:
    if: startsWith(github.head_ref, 'diag/wp06-custom-domain-delivery-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUSTOM_BASE: "https://www.xusen.pro"
      CONTROL_BASE: "https://31bedf26.hanyao.pages.dev"
      REPAIR_PATH: "/services/ac-repair/"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v4

      - name: Resolve Chrome and Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "CHROME_NOT_FOUND" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version
          node --version
          npx --yes lighthouse@13.4.1 --version

      - name: Capture DNS, headers, and interleaved curl timings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wp06-domain
          {
            echo "## getent www.xusen.pro"
            getent ahosts www.xusen.pro || true
            echo
            echo "## getent 31bedf26.hanyao.pages.dev"
            getent ahosts 31bedf26.hanyao.pages.dev || true
          } > .wp06-domain/dns.txt

          curl -sS "$CONTROL_BASE$REPAIR_PATH" -o .wp06-domain/control-repair.html
          asset_path="$(grep -oE '/_next/static/[^"[:space:]]+\.js' .wp06-domain/control-repair.html | head -n 1 || true)"
          if [[ -z "$asset_path" ]]; then
            echo "STATIC_ASSET_PATH_NOT_FOUND" >&2
            exit 1
          fi
          echo "$asset_path" > .wp06-domain/static-path.txt

