name: WP06 GTM critical-path diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wp06-domain-delivery-diagnostic.yml"

permissions:
  contents: read

jobs:
  compare:
    if: startsWith(github.head_ref, 'diag/wp06-custom-domain-delivery-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compare normal versus GTM-blocked Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wp06-gtm
          url='https://www.xusen.pro/services/ac-repair/'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --version
          npx --yes lighthouse@13.4.1 --version
          for i in 1 2 3; do
            npx --yes lighthouse@13.4.1 "$url" --only-categories=performance --form-factor=mobile --throttling-method=simulate --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=".wp06-gtm/normal-$i.json" --quiet
            npx --yes lighthouse@13.4.1 "$url" --only-categories=performance --form-factor=mobile --throttling-method=simulate --blocked-url-patterns='*://www.googletagmanager.com/*' --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=".wp06-gtm/blocked-$i.json" --quiet
          done
          python3 - <<'PY'
          import glob,json,statistics,urllib.parse
          for mode in ('normal','blocked'):
            vals=[]
            for fn in sorted(glob.glob('.wp06-gtm/'+mode+'-*.json')):
              d=json.load(open(fn)); a=d['audits']
              vals.append({
                'perf':d['categories']['performance']['score']*100,
                'fcp':a['first-contentful-paint']['numericValue'],
                'lcp':a['largest-contentful-paint']['numericValue'],
                'tbt':a['total-blocking-time']['numericValue'],
                'main':a['mainthread-work-breakdown']['numericValue'],
                'unused':(a.get('unused-javascript',{}).get('details') or {}).get('overallSavingsBytes') or 0,
              })
            med=lambda k: statistics.median(v[k] for v in vals)
            print(mode,{k:round(med(k),1) for k in ('perf','fcp','lcp','tbt','main','unused')})
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp06-gtm-critical-path
          path: .wp06-gtm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
