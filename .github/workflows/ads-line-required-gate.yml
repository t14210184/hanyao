name: Ads LINE required gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-line-required-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ads LINE required gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify immutable attribution snapshot
        run: npm run test:v13:p0a
      - name: Verify provider ACK and RESULT_UNKNOWN recovery
        run: npm run test:v13:p0b
      - name: Verify atomic terminal completion
        run: npm run test:v13:p0c
      - name: Verify durable provider quality evidence
        run: npm run test:v13:p1m03
      - name: Verify LINE identity key rotation compatibility
        run: npm run test:v13:p1m05
      - name: Verify bounded attribution timing and session reuse
        run: npm run test:v13:p1m06
      - name: Verify v1.3 attribution, CTA, modal, and live-gate closure
        run: npm run test:v13:p1m06m11
      - name: Verify uploader, duplicate context, and auth hardening
        run: npm run test:line4a:unit
      - name: Verify uploader static mutation boundary
        run: npm run test:line4a:static
      - name: Verify HG09 single-writer config and topology invariant
        run: npm run test:hg09:topology
      - name: Verify LINE token and webhook contracts
        run: |
          npm run test:line1a:unit
          npm run test:line1b1:unit
          npm run test:line1b2a:unit
          npm run test:line1b2b:unit
      - name: Verify WP01 GTM funnel bridge contract
        run: npm run test:wp01:gtm
      - name: Verify Google Ads short-lived provider auth
        run: npm run test:google-ads:auth
      - name: Verify governed Google Ads host provider runner
        run: npm run test:google-ads:host-runner
      - name: Parse Google Ads host provider PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/google-ads-provider-host-runner.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE_FAILED'
          }
          Write-Host 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE=PASS'
      - name: Verify WP02 exact-negative provider contract
        run: npm run test:wp02:mutate
      - name: Verify WP03 staged RSA provider contract
        run: npm run test:wp03:rsa
      - name: Verify WP05 LINE UI evidence contract
        run: npm run test:wp05:ui
      - name: Verify WP10 current execution gate ledger
        run: npm run test:wp10:ledger
      - name: Verify workflow mutation boundary
        run: node scripts/v12-workflow-safety.test.mjs
