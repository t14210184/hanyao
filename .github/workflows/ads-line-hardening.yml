name: Ads LINE hardening

on:
  push:
    branches:
      - feat/ads-line-production-hardening
      - fix/ads-line-v1-2-repair
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/high-intent-*.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/hg09-*"
      - "scripts/hg10-*"
      - "scripts/cloudflare-d1-*"
      - "scripts/conversion-closure-*"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-landing-*"
      - "scripts/ads-line-message-*"
      - "scripts/ads-message-asset-*"
      - "scripts/ads-enhanced-conversion-*"
      - "scripts/ads-qualified-lead-*"
      - "scripts/ads-optimization-*"
      - "scripts/google-ads-read-*"
      - "scripts/google-ads-provider-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/v12-high-intent-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/high-intent-*.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/hg09-*"
      - "scripts/hg10-*"
      - "scripts/cloudflare-d1-*"
      - "scripts/conversion-closure-*"
      - "src/components/MobileStickyCTA.tsx"
      - "src/app/services/ac-repair/AcRepairServiceClient.tsx"
      - "src/app/services/ac-cleaning/AcCleaningServiceClient.tsx"
      - "src/app/services/page.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "scripts/ads-cro-repair-static.test.mjs"
      - "scripts/ads-cro-repair-hero-static.test.mjs"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-landing-*"
      - "scripts/ads-line-message-*"
      - "scripts/ads-message-asset-*"
      - "scripts/ads-enhanced-conversion-*"
      - "scripts/ads-qualified-lead-*"
      - "scripts/ads-optimization-*"
      - "scripts/google-ads-read-*"
      - "scripts/google-ads-provider-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/wp06-lighthouse-summarize.mjs"
      - "scripts/v12-high-intent-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"
      - ".github/workflows/wp02-cloudflare-provider-surface.yml"
      - ".github/workflows/wp06-mobile-performance-audit.yml"

permissions:
  contents: read
jobs:
  verify:
    name: Ads LINE hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static export for Pages HTTP integration
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify repair mobile CRO invariants
        run: node scripts/ads-cro-repair-static.test.mjs
      - name: Verify repair hero CRO invariants
        run: node scripts/ads-cro-repair-hero-static.test.mjs
      - name: Verify Google Ads short-lived provider auth
        run: npm run test:google-ads:auth
      - name: Verify enhanced conversion prerequisite readback
        run: npm run test:hq05:prereq
      - name: Verify HQ06 enhanced user-data payload and snapshot
        run: npm run test:hq06:userdata
      - name: Verify HQ07 Qualified Lead action contract and create fence
        run: npm run test:hq07:qualified-action
      - name: Verify V1.1 WP02-WP06 hardening contracts
        run: npm run test:v11:wp02-wp06
      - name: Verify V1.1 WP07-WP09 stage ledger and multi-destination contracts
        run: npm run test:v11:wp07-wp09
      - name: Verify governed Google Ads host provider runner
        run: npm run test:google-ads:host-runner
      - name: Parse Google Ads host provider PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/google-ads-provider-host-runner.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE_FAILED'
          }
          Write-Host 'HANYAO_GOOGLE_ADS_HOST_RUNNER_PARSE=PASS'
      - name: Parse HG10 SYSTEM readback PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/hg10-system-readback-runner.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'HANYAO_HG10_SYSTEM_RUNNER_PARSE_FAILED'
          }
          Write-Host 'HANYAO_HG10_SYSTEM_RUNNER_PARSE=PASS'
      - name: Verify Ads search-hygiene classification boundaries
        run: node --experimental-strip-types --test scripts/ads-search-hygiene-rules.test.ts
      - name: Verify WP02 exact-negative provider contract
        run: npm run test:wp02:mutate
      - name: Verify RSA candidate limits and rollout boundary
        run: node --experimental-strip-types --test scripts/ads-rsa-candidates.test.ts
      - name: Verify WP03 staged RSA provider contract
        run: npm run test:wp03:rsa
      - name: Verify Ads-to-landing promise alignment
        run: node --experimental-strip-types --test scripts/ads-landing-promise-matrix.test.ts
      - name: Verify LINE Message Asset pilot isolation and fail-closed gates
        run: node --experimental-strip-types --test scripts/ads-line-message-pilot.test.ts
      - name: Verify WP05 LINE UI evidence contract
        run: npm run test:wp05:ui
      - name: Verify WP10 current execution gate ledger
        run: npm run test:wp10:ledger
      - name: Verify Google Ads read auth and audit log privacy
        run: node scripts/google-ads-read-contract-static.test.mjs
      - name: Verify HG10 conversion readback closure contracts
        run: npm run test:hg10:readback
      - name: Verify WP01 GTM funnel bridge contract
        run: npm run test:wp01:gtm
      - name: Run canonical LINE webhook unit regression
        run: npm run test:line1a:unit
      - name: Run canonical LINE webhook HTTP regression
        run: npm run test:line1a:http
      - name: Run uploader regression suite
        run: npm run test:line4a
      - name: Replay reconstructed migrations 0001 through 0008
        run: node scripts/v12-migration-reconstruction.test.mjs
      - name: Run retention regression
        run: npm run test:line4c:retention
      - name: Verify Ads reporting evidence cannot use historical totals
        run: node --experimental-strip-types --test scripts/line4d-reporting-evidence.test.ts
      - name: Verify workflows remain non-mutating
        run: node scripts/v12-workflow-safety.test.mjs
      - name: Verify bounded attribution timing and session reuse
        run: npm run test:v13:p1m06
      - name: Verify v1.3 attribution, CTA, modal, and live-gate closure
        run: npm run test:v13:p1m06m11
      - name: Run attribution/prepare regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run test:c1b1:unit
          npm run test:c1b1:http
          npm run test:c1b1:r1
          npm run test:c1b1:config
      - name: Run LINE QR browser smoke
        env:
          LINE_BROWSER_GATE_REQUIRED: "1"
        run: npm run test:line1b2b:browser
