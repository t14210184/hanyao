name: Ads LINE hardening

on:
  push:
    branches:
      - feat/ads-line-production-hardening
      - fix/ads-line-v1-2-repair
      - feat/wp02-cloudflare-provider-surface-20260918
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/hg09-*"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-landing-*"
      - "scripts/ads-line-message-*"
      - "scripts/google-ads-read-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/hg09-*"
      - "src/components/MobileStickyCTA.tsx"
      - "src/app/services/ac-repair/AcRepairServiceClient.tsx"
      - "src/app/services/ac-cleaning/AcCleaningServiceClient.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "scripts/ads-cro-repair-static.test.mjs"
      - "scripts/ads-cro-repair-hero-static.test.mjs"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-landing-*"
      - "scripts/ads-line-message-*"
      - "scripts/google-ads-read-*"
      - "scripts/gtm-wp01-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/wp06-lighthouse-summarize.mjs"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"
      - ".github/workflows/wp06-mobile-performance-audit.yml"

permissions:
  contents: read
jobs:
  verify:
    name: Ads LINE hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: WP02 read Production Worker secret names only
        if: github.ref_name == 'feat/wp02-cloudflare-provider-surface-20260918'
        shell: bash
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_LEGACY: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_LEGACY_VAR: ${{ vars.CF_ACCOUNT_ID }}
          CF_ACCOUNT_LEGACY_SECRET: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${CF_TOKEN_PRIMARY:-}"
          if [[ -z "$token" ]]; then token="${CF_TOKEN_LEGACY:-}"; fi
          account="${CF_ACCOUNT_VAR:-}"
          if [[ -z "$account" ]]; then account="${CF_ACCOUNT_SECRET:-}"; fi
          if [[ -z "$account" ]]; then account="${CF_ACCOUNT_LEGACY_VAR:-}"; fi
          if [[ -z "$account" ]]; then account="${CF_ACCOUNT_LEGACY_SECRET:-}"; fi
          if [[ -z "$token" ]]; then
            echo "WP02_CF_PROVIDER_SURFACE=FAIL:CLOUDFLARE_API_TOKEN_MISSING"
            exit 2
          fi
          if [[ -z "$account" ]]; then
            echo "WP02_CF_PROVIDER_SURFACE=FAIL:CLOUDFLARE_ACCOUNT_ID_MISSING"
            exit 3
          fi
          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          npx wrangler secret list             --config workers/google-ads-uploader/wrangler.jsonc             --env production             --format json > /tmp/wp02-secret-names.json
          node <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync("/tmp/wp02-secret-names.json", "utf8"));
          const rows = Array.isArray(parsed) ? parsed : Array.isArray(parsed?.secrets) ? parsed.secrets : [];
          const names = new Set(rows.map((row) => typeof row === "string" ? row : row?.name).filter(Boolean));
          const required = ["GOOGLE_DATA_MANAGER_SERVICE_ACCOUNT_JSON","PRODUCTION_HUMAN_GATE"];
          const missing = required.filter((name) => !names.has(name));
          console.log(JSON.stringify({
            result: missing.length === 0 ? "WP02_CF_PROVIDER_SURFACE_READY" : "WP02_CF_PROVIDER_SURFACE_BLOCKED",
            worker: "google-ads-uploader-production",
            secretNameCount: names.size,
            requiredSecretsPresent: required.filter((name) => names.has(name)),
            missingRequiredSecrets: missing,
            secretValuesRead: false,
            mutationApplied: false
          }));
          if (missing.length > 0) process.exit(5);
          NODE
          rm -f /tmp/wp02-secret-names.json
      - name: Build static export for Pages HTTP integration
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify repair mobile CRO invariants
        run: node scripts/ads-cro-repair-static.test.mjs
      - name: Verify repair hero CRO invariants
        run: node scripts/ads-cro-repair-hero-static.test.mjs
      - name: Verify Ads search-hygiene classification boundaries
        run: node --experimental-strip-types --test scripts/ads-search-hygiene-rules.test.ts
      - name: Verify WP02 exact-negative provider contract
        run: npm run test:wp02:mutate
      - name: Verify RSA candidate limits and rollout boundary
        run: node --experimental-strip-types --test scripts/ads-rsa-candidates.test.ts
      - name: Verify Ads-to-landing promise alignment
        run: node --experimental-strip-types --test scripts/ads-landing-promise-matrix.test.ts
      - name: Verify LINE Message Asset pilot isolation and fail-closed gates
        run: node --experimental-strip-types --test scripts/ads-line-message-pilot.test.ts
      - name: Verify Google Ads read auth and audit log privacy
        run: node scripts/google-ads-read-contract-static.test.mjs
      - name: Verify WP01 GTM funnel bridge contract
        run: npm run test:wp01:gtm
      - name: Run canonical LINE webhook unit regression
        run: npm run test:line1a:unit
      - name: Run canonical LINE webhook HTTP regression
        run: npm run test:line1a:http
      - name: Run uploader regression suite
        run: npm run test:line4a
      - name: Replay reconstructed migrations 0001 through 0008
        run: node scripts/v12-migration-reconstruction.test.mjs
      - name: Run retention regression
        run: npm run test:line4c:retention
      - name: Verify Ads reporting evidence cannot use historical totals
        run: node --experimental-strip-types --test scripts/line4d-reporting-evidence.test.ts
      - name: Verify workflows remain non-mutating
        run: node scripts/v12-workflow-safety.test.mjs
      - name: Verify bounded attribution timing and session reuse
        run: npm run test:v13:p1m06
      - name: Verify v1.3 attribution, CTA, modal, and live-gate closure
        run: npm run test:v13:p1m06m11
      - name: Run attribution/prepare regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run test:c1b1:unit
          npm run test:c1b1:http
          npm run test:c1b1:r1
          npm run test:c1b1:config
      - name: Run LINE QR browser smoke
        env:
          LINE_BROWSER_GATE_REQUIRED: "1"
        run: npm run test:line1b2b:browser
