name: Ads LINE hardening

on:
  push:
    branches:
      - feat/ads-line-production-hardening
      - fix/ads-line-v1-2-repair
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-line-message-*"
      - "scripts/google-ads-read-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/api/line/**"
      - "functions/_lib/line-webhook.ts"
      - "functions/_lib/types.ts"
      - "workers/google-ads-uploader/**"
      - "src/components/MobileStickyCTA.tsx"
      - "src/app/services/ac-repair/AcRepairServiceClient.tsx"
      - "scripts/ads-cro-repair-static.test.mjs"
      - "scripts/ads-cro-repair-hero-static.test.mjs"
      - "scripts/ads-search-hygiene-*"
      - "scripts/ads-rsa-*"
      - "scripts/ads-line-message-*"
      - "scripts/google-ads-read-*"
      - "scripts/line1a-*"
      - "scripts/line1b1-*"
      - "scripts/line1b2a-*"
      - "scripts/line1b2b-*"
      - "scripts/c1b1-*"
      - "scripts/line4a-*"
      - "scripts/line4b-*"
      - "scripts/line4c-*"
      - "scripts/line4d-*"
      - "scripts/v12-migration-reconstruction.test.mjs"
      - "scripts/v12-workflow-safety.test.mjs"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ads-line-hardening.yml"

permissions:
  contents: read
jobs:
  verify:
    name: Ads LINE hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static export for Pages HTTP integration
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify repair mobile CRO invariants
        run: node scripts/ads-cro-repair-static.test.mjs
      - name: Verify repair hero CRO invariants
        run: node scripts/ads-cro-repair-hero-static.test.mjs
      - name: Verify Ads search-hygiene classification boundaries
        run: node --experimental-strip-types --test scripts/ads-search-hygiene-rules.test.ts
      - name: Verify RSA candidate limits and rollout boundary
        run: node --experimental-strip-types --test scripts/ads-rsa-candidates.test.ts
      - name: Verify LINE Message Asset pilot isolation and fail-closed gates
        run: node --experimental-strip-types --test scripts/ads-line-message-pilot.test.ts
      - name: Verify Google Ads read auth and audit log privacy
        run: node scripts/google-ads-read-contract-static.test.mjs
      - name: Run canonical LINE webhook unit regression
        run: npm run test:line1a:unit
      - name: Run canonical LINE webhook HTTP regression
        run: npm run test:line1a:http
      - name: Run uploader regression suite
        run: npm run test:line4a
      - name: Replay reconstructed migrations 0001 through 0008
        run: node scripts/v12-migration-reconstruction.test.mjs
      - name: Run retention regression
        run: npm run test:line4c:retention
      - name: Verify Ads reporting evidence cannot use historical totals
        run: node --experimental-strip-types --test scripts/line4d-reporting-evidence.test.ts
      - name: Verify workflows remain non-mutating
        run: node scripts/v12-workflow-safety.test.mjs
      - name: Verify bounded attribution timing and session reuse
        run: npm run test:v13:p1m06
      - name: Verify v1.3 attribution, CTA, modal, and live-gate closure
        run: npm run test:v13:p1m06m11
      - name: Run attribution/prepare regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run test:c1b1:unit
          npm run test:c1b1:http
          npm run test:c1b1:r1
          npm run test:c1b1:config
      - name: Run LINE QR browser smoke
        env:
          LINE_BROWSER_GATE_REQUIRED: "1"
        run: npm run test:line1b2b:browser
